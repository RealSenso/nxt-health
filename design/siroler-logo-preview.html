<title>SirOsler Logo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout concept: the mark and wordmark shown large on dark and light grounds, then at nav and favicon sizes. */
:root { --ink: #f2f4f1; --bg: #070807; --panel-bg: #f5f7f4; --panel-ink: #0a0d0a; --green: #3df08a; --green-light: #0b8a44; --mute: #8f988f; --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); margin: 0; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -0.03em; margin: 0 0 8px; }
p { color: var(--mute); margin: 0; max-width: 40em; line-height: 1.55; }
.board { border-radius: 22px; padding: clamp(32px, 7vw, 80px); display: flex; align-items: center; justify-content: center; }
.dark { background: #111; color: #f4f4f4; --g: var(--green); }
.light { background: var(--panel-bg); color: var(--panel-ink); --g: var(--green-light); }
.logo { display: inline-flex; align-items: center; gap: .5em; line-height: 1; letter-spacing: -0.045em; }
.logo svg { width: 1.55em; height: 1.55em; }
.logo .sir { font-weight: 400; } .logo .osler { font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 20px; }
.row .board { flex: 1 1 280px; padding: 32px; }
.mark-only svg { width: 120px; height: 120px; }
</style>
<div class="wrap">
  <div><h1>SirOsler</h1><p>A ring for the O, a lens on the patient, with a guiding star at its centre and a second star in orbit. It echoes the star theme of the hero. "Sir" is light, "Osler" is bold.</p></div>

  <div class="board dark"><span class="logo" style="font-size:72px">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.6" stroke="currentColor" stroke-width="2.2"/><path d="M16 6.6Q16 16 25.4 16Q16 16 16 25.4Q16 16 6.6 16Q16 16 16 6.6Z" fill="var(--g)"/><circle cx="25.6" cy="6.4" r="2" fill="var(--g)"/></svg>
    <span><span class="sir">Sir</span><span class="osler">Osler</span></span></span></div>

  <div class="board light"><span class="logo" style="font-size:72px">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.6" stroke="currentColor" stroke-width="2.2"/><path d="M16 6.6Q16 16 25.4 16Q16 16 16 25.4Q16 16 6.6 16Q16 16 16 6.6Z" fill="var(--g)"/><circle cx="25.6" cy="6.4" r="2" fill="var(--g)"/></svg>
    <span><span class="sir">Sir</span><span class="osler">Osler</span></span></span></div>

  <div class="row">
    <div class="board dark mark-only"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.6" stroke="currentColor" stroke-width="2.2"/><path d="M16 6.6Q16 16 25.4 16Q16 16 16 25.4Q16 16 6.6 16Q16 16 16 6.6Z" fill="var(--g)"/><circle cx="25.6" cy="6.4" r="2" fill="var(--g)"/></svg></div>
    <div class="board light" style="gap:24px">
      <span class="logo" style="font-size:22px"><svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="12.6" stroke="currentColor" stroke-width="2.2"/><path d="M16 6.6Q16 16 25.4 16Q16 16 16 25.4Q16 16 6.6 16Q16 16 16 6.6Z" fill="var(--g)"/><circle cx="25.6" cy="6.4" r="2" fill="var(--g)"/></svg><span><span class="sir">Sir</span><span class="osler">Osler</span></span></span>
      <svg viewBox="0 0 32 32" fill="none" width="16" height="16"><circle cx="16" cy="16" r="12.6" stroke="currentColor" stroke-width="2.2"/><path d="M16 6.6Q16 16 25.4 16Q16 16 16 25.4Q16 16 6.6 16Q16 16 16 6.6Z" fill="var(--g)"/><circle cx="25.6" cy="6.4" r="2" fill="var(--g)"/></svg>
    </div>
  </div>
</div>
